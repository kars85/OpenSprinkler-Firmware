# Based heavily on the docker build action from immich (https://github.com/immich-app/immich/)

name: Build CI and Release

on:
  # NOTE: on a fork, GitHub Actions does not auto-run this workflow for PRs.
  # To build-verify a branch manually: Actions tab -> "Build CI and Release" -> "Run workflow"
  # (or: gh workflow run "Build CI and Release" --ref <branch>).
  # PlatformIO, DEMO contract, and Docker builds run on PRs without publish credentials.
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight publication after its protected environment is approved.
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-pio:
    name: Build PlatformIO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.13'
      - name: Install python
        run: sudo apt-get install python3 python3-pip
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20' # Or any recent LTS version

      - name: Install html-minifier-terser
        run: npm install html-minifier-terser

      - name: Build PlatformIO Project
        run: pio run --environment os3x_esp8266

      - name: Derive fork build name
        id: fwname
        # Build a self-identifying binary name from the version macros in defines.h
        # so a downloaded firmware image is traceable to its exact fork build
        # (e.g. firmware_os_esp8266_221.4_kars85.1.bin). Keeps Tier 1 "distinguishable
        # builds" honest at the artifact level. See docs/fork-versioning.md.
        run: |
          FWV=$(grep -E '^#define[[:space:]]+OS_FW_VERSION' defines.h | grep -oE '[0-9]+' | head -1)
          FWM=$(grep -E '^#define[[:space:]]+OS_FW_MINOR' defines.h | grep -oE '[0-9]+' | head -1)
          FORK_ID=$(grep -E '^#define[[:space:]]+OSF_FORK_ID' defines.h | sed -E 's/.*"([^"]*)".*/\1/')
          FORK_BUILD=$(grep -E '^#define[[:space:]]+OSF_FORK_BUILD' defines.h | grep -oE '[0-9]+' | head -1)
          NAME="firmware_os_esp8266_${FWV}.${FWM}_${FORK_ID}.${FORK_BUILD}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Firmware artifact: ${NAME}.bin"

      - name: Move and rename firmware
        run: mv .pio/build/os3x_esp8266/firmware.bin "./${{ steps.fwname.outputs.name }}.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Artifact bundle stays "firmware" so the release-pio download step keeps
          # working; the versioned name is on the .bin file inside.
          name: firmware
          path: ./${{ steps.fwname.outputs.name }}.bin
  build-demo:
    name: Build Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build Script
        run: sudo ./build.sh -s demo

      - name: Build authenticated contract fixture
        run: sudo env DEMO_AUTH_TEST=1 DEMO_HTTP_PORT=18080 ./build.sh -s demo

      - name: Test modern App firmware contract
        run: python3 tests/firmware_contract_smoke.py --binary ./OpenSprinkler --port 18080

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm/v7,linux/arm64' }}
          push: false
          outputs: type=oci,dest=./image.tar
          cache-from: type=gha,scope=ospi
          cache-to: type=gha,mode=max,scope=ospi,ignore-error=true

      - name: Upload image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: ./image.tar
  validate-release:
    name: Validate Release Source
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Checkout published release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Validate protected master ancestry and release identity
        id: release
        shell: bash
        env:
          IS_DRAFT: ${{ github.event.release.draft }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if [[ "$IS_DRAFT" != "false" || "$IS_PRERELEASE" != "false" ]]; then
            echo "Only a published, non-draft stable release may publish firmware artifacts." >&2
            exit 1
          fi
          if [[ "$RELEASE_TARGET" != "master" && "$RELEASE_TARGET" != "refs/heads/master" ]]; then
            echo "Release target must be master, not $RELEASE_TARGET." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^fw-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-kars85\.[1-9][0-9]*$ ]]; then
            echo "Release tag does not match fw-<major>.<minor>.<patch>.<firmware-minor>-kars85.<build>: $RELEASE_TAG" >&2
            exit 1
          fi

          fwv=$(awk '$1 == "#define" && $2 == "OS_FW_VERSION" { print $3; exit }' defines.h)
          fwm=$(awk '$1 == "#define" && $2 == "OS_FW_MINOR" { print $3; exit }' defines.h)
          fork_id=$(awk '$1 == "#define" && $2 == "OSF_FORK_ID" { gsub(/"/, "", $3); print $3; exit }' defines.h)
          fork_build=$(awk '$1 == "#define" && $2 == "OSF_FORK_BUILD" { print $3; exit }' defines.h)
          if ! [[ "$fwv" =~ ^([0-9])([0-9])([0-9]+)$ ]]; then
            echo "OS_FW_VERSION is not a three-component numeric version: $fwv" >&2
            exit 1
          fi
          fw_major=${BASH_REMATCH[1]}
          fw_minor=${BASH_REMATCH[2]}
          fw_patch=${BASH_REMATCH[3]}
          if ! [[ "$fwm" =~ ^[0-9]+$ && "$fork_id" =~ ^[a-z0-9][a-z0-9_-]*$ &&
                  "$fork_build" =~ ^[1-9][0-9]*$ ]]; then
            echo "Firmware identity macros are not valid release components." >&2
            exit 1
          fi
          expected_tag="fw-${fw_major}.${fw_minor}.${fw_patch}.${fwm}-${fork_id}.${fork_build}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match source identity $expected_tag." >&2
            exit 1
          fi

          git fetch --no-tags origin master:refs/remotes/origin/master
          source_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            echo "Release event SHA $GITHUB_SHA does not match tag target $source_sha." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_sha" origin/master; then
            echo "Release tag $RELEASE_TAG is not reachable from protected master." >&2
            exit 1
          fi

          owner=${GITHUB_REPOSITORY_OWNER,,}
          repository=${GITHUB_REPOSITORY#*/}
          repository=${repository,,}
          image_name="ghcr.io/${owner}/${repository}"
          {
            echo "image_name=$image_name"
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Validated immutable release source $RELEASE_TAG at $source_sha."

  release-pio:
    name: Publish Firmware Binary
    runs-on: ubuntu-latest
    needs: [validate-release, build-pio, build-demo, build-docker]
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    permissions:
      contents: write
    environment:
      name: firmware-release
      url: ${{ github.event.release.html_url }}
    steps:
      - name: Download firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: ./firmware

      - name: Upload immutable firmware asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          mapfile -t assets < <(find ./firmware -maxdepth 1 -type f -name '*.bin' -print)
          if (( ${#assets[@]} != 1 )); then
            echo "Expected exactly one firmware binary, found ${#assets[@]}." >&2
            exit 1
          fi
          # Deliberately omit --clobber: an existing release asset is immutable and fails closed.
          gh release upload "$RELEASE_TAG" "${assets[0]}" --repo "$GITHUB_REPOSITORY"

  release-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [validate-release, build-pio, build-demo, build-docker]
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: firmware-release
      url: ${{ github.event.release.html_url }}
    steps:
      - name: Checkout validated release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate docker image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          flavor: latest=false
          images: ${{ needs.validate-release.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.release_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.release_tag }}

      - name: Refuse to overwrite an existing release image tag
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.validate-release.outputs.image_name }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          if inspect_output=$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" 2>&1); then
            echo "Release image ${IMAGE_NAME}:${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          inspect_error=${inspect_output,,}
          if [[ "$inspect_error" != *"not found"* && "$inspect_error" != *"manifest unknown"* &&
                  "$inspect_error" != *"name unknown"* && "$inspect_error" != *"repository name not known"* ]]; then
            echo "Could not prove release image tag is unused; refusing publication: $inspect_output" >&2
            exit 1
          fi

      - name: Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          cache-from: type=gha,scope=ospi
          cache-to: type=gha,mode=max,scope=ospi-release
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
